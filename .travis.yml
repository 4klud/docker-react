sudo: true
services:
  - docker



before_install: 
  - docker build -t 4klud/docker-react -f Dockerfile.dev .

script: 
  - docker run -e CI=true 4klud/docker-react npm run test -- --coverage

deploy: 
  provider: elasticbeanstalk
  region: "us-west-2"
  app: "docker-react"
  env: "Frontend-env"
  bucket_name: "elasticbeanstalk-us-west-2-625980020286"
  bucket_path: "docker-react"
  on:
    branch: master
  access_key_id: $AWS_ACCESS_KEY
  secret_access_key: $AWS_SECRET_KEY
